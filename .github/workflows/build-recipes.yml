name: Build recipes.json

on:
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "scripts/build_recipes.py"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - "recipes/**"
      - "scripts/build_recipes.py"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # On PRs: parse every recipe and fail if the committed JSON is stale.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/build_recipes.py --check

  # On main: regenerate and commit.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate docs/recipes.json from recipes/**.md
        run: python3 scripts/build_recipes.py

      - name: Commit the regenerated JSON if it changed
        run: |
          if git diff --quiet docs/recipes.json docs/it/recipes.json docs/version.js; then
            echo "recipes.json already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/recipes.json docs/it/recipes.json docs/version.js
          git commit -m "Rebuild recipes.json from markdown sources"
          git push
