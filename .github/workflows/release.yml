name: Release

# Builds and publishes the WellEating distribution on every version tag:
#   - Docker image (multi-arch)  -> ghcr.io/<owner>/welleating
#   - Helm chart (OCI)           -> ghcr.io/<owner>/charts/welleating
#   - Chart .tgz attached to the GitHub Release
#
# Usage: git tag v0.7.1 && git push origin v0.7.1

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/welleating
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Resolve version and lowercase owner
        id: version
        # OCI references must be lowercase; github.repository_owner is
        # "MassimoDanieli", which made `helm push` fail on v0.7.0.
        # (docker/metadata-action lowercases on its own, helm does not.)
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm lint chart/welleating
          helm package chart/welleating \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/

      - name: Log in to GHCR for Helm
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | helm registry login "$REGISTRY" -u "$ACTOR" --password-stdin

      - name: Push chart as OCI artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ steps.version.outputs.owner }}
        run: helm push "dist/welleating-${VERSION}.tgz" "oci://${REGISTRY}/${OWNER}/charts"

      - name: Attach chart to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/welleating-*.tgz
          generate_release_notes: true
