replicaCount: 1

image:
  # Published by the Release workflow on every v* tag.
  repository: ghcr.io/massimodanieli/welleating
  # Empty = the chart's appVersion, so chart and image versions match.
  tag: ""
  pullPolicy: IfNotPresent

# Cookbook content. Choose ONE:
content:
  # 1. Git repository cloned at pod start (public repos only)
  repo: ""            # e.g. https://github.com/you/your-cookbook
  branch: main
  # 2. Existing PVC mounted at /content (leave repo empty)
  existingClaim: ""

theme:
  name: forest        # forest | ocean | terracotta | slate
  accentColor: ""     # optional accent override, e.g. "#c2185b"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: welleating.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
